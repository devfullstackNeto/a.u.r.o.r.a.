  <g fill="#24474d" font-family="Arial,sans-serif" font-size="19"><text x="105" y="230">Motor de regras + dez trilhas</text><text x="105" y="311">PWA + persistência IndexedDB</text><text x="105" y="392">Fluxo, feedback, SUS e mentoria</text><text x="647" y="230">Processador + firmware</text><text x="647" y="311">Microfone, áudio e botão</text><text x="647" y="392">Vibração, LED e bateria</text></g>
  <path d="M525 292h62" stroke="#b28549" stroke-width="3" stroke-dasharray="7 7"/><text x="556" y="274" text-anchor="middle" fill="#93714b" font-family="Arial,sans-serif" font-size="13">integração</text><text x="560" y="526" text-anchor="middle" fill="#687f79" font-family="Arial,sans-serif" font-size="16">A interface digital valida a lógica no navegador; nenhuma integração embarcada foi realizada.</text>
