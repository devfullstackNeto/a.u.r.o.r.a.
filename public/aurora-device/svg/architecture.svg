  <rect x="54" y="112" width="470" height="358" rx="24" fill="#e5f0e9" stroke="#a7cbb9" stroke-width="2"/><rect x="596" y="112" width="470" height="358" rx="24" fill="#f5eee1" stroke="#dcc99e" stroke-width="2"/>
  <g font-family="Arial,sans-serif"><text x="82" y="157" fill="#2b775b" font-size="15" font-weight="bold" letter-spacing="2">IMPLEMENTADO NO NAVEGADOR</text><text x="624" y="157" fill="#9d6f37" font-size="15" font-weight="bold" letter-spacing="2">FUTURA IMPLEMENTAÇÃO FÍSICA</text></g>
