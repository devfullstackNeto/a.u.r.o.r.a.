<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 575" role="img" aria-labelledby="title desc">
  <title id="title">Estados visuais conceituais</title><desc id="desc">Sete estados com cor, símbolo e texto: aguardando, ouvindo, processando, respondendo, atividade concluída, erro e offline.</desc>
  <rect width="1120" height="575" rx="28" fill="#f6f7f2"/><text x="58" y="66" fill="#173c43" font-family="Georgia,serif" font-size="37">Estados de operação</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-size="19">
    <g transform="translate(60 110)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#aabbb5"/><text x="118" y="114" fill="#23464d">AGUARDANDO</text></g>
    <g transform="translate(315 110)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#e8ae65"/><text x="118" y="114" fill="#23464d">OUVINDO</text></g>
    <g transform="translate(570 110)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#6fa6af"/><text x="118" y="114" fill="#23464d">PROCESSANDO</text></g>
    <g transform="translate(825 110)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#6b9bca"/><text x="118" y="114" fill="#23464d">RESPONDENDO</text></g>
    <g transform="translate(190 290)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#77b293"/><text x="118" y="110" fill="#23464d" font-size="17">ATIVIDADE</text><text x="118" y="133" fill="#23464d" font-size="17">CONCLUÍDA</text></g>
    <g transform="translate(445 290)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#c97666"/><text x="118" y="114" fill="#23464d">ERRO</text></g>
    <g transform="translate(700 290)"><rect width="235" height="155" rx="19" fill="#fff" stroke="#d8e4de"/><circle cx="118" cy="54" r="23" fill="#667a9a"/><text x="118" y="114" fill="#23464d">OFFLINE</text></g>
  </g><text x="560" y="523" text-anchor="middle" fill="#687f79" font-family="Arial,sans-serif" font-size="15">Cor sempre acompanhada por texto; LED, áudio e vibração físicos ainda não foram implementados.</text>
</svg>
