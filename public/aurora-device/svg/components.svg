<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceitual de componentes</title><desc id="desc">Diagrama de componentes previstos para futura pulseira, sem seleção ou teste de peças.</desc>
  <rect width="1100" height="720" rx="28" fill="#f5f7f1"/><text x="70" y="74" fill="#183e45" font-family="Georgia,serif" font-size="38">Componentes previstos</text><text x="70" y="108" fill="#6b807a" font-family="Arial,sans-serif" font-size="17">Arquitetura de referência para futura prototipagem física</text>
  <g fill="#fff" stroke="#d5e2dc" stroke-width="2"><rect x="72" y="170" width="260" height="145" rx="18"/><rect x="420" y="170" width="260" height="145" rx="18"/><rect x="768" y="170" width="260" height="145" rx="18"/><rect x="72" y="390" width="260" height="145" rx="18"/><rect x="420" y="390" width="260" height="145" rx="18"/><rect x="768" y="390" width="260" height="145" rx="18"/></g>
  <g fill="#b17d3c" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="2"><text x="98" y="205">01 · ENTRADA</text><text x="446" y="205">02 · CAPTAÇÃO</text><text x="794" y="205">03 · PROCESSAMENTO</text><text x="98" y="425">04 · SAÍDA</text><text x="446" y="425">05 · SINALIZAÇÃO</text><text x="794" y="425">06 · ENERGIA</text></g>
  <g fill="#1d4249" font-family="Arial,sans-serif" font-size="24" font-weight="bold"><text x="98" y="248">Botão principal</text><text x="446" y="248">Microfone</text><text x="794" y="248">Módulo local</text><text x="98" y="468">Áudio</text><text x="446" y="468">LED + vibração</text><text x="794" y="468">Bateria</text></g>
  <g fill="#617b79" font-family="Arial,sans-serif" font-size="16"><text x="98" y="280">Acionamento simples</text><text x="446" y="280">Voz opcional</text><text x="794" y="280">Firmware futuro</text><text x="98" y="500">Resposta falada prevista</text><text x="446" y="500">Feedback perceptível</text><text x="794" y="500">Autonomia a medir</text></g>
  <g stroke="#8eb2a3" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M335 242h75"/><path d="M683 242h75"/><path d="M900 322v58"/><path d="M765 465h-75"/><path d="M417 465h-75"/></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0l8 3-8 3" fill="#8eb2a3"/></marker></defs>
  <text x="550" y="633" text-anchor="middle" fill="#183e45" font-family="Arial,sans-serif" font-size="17">O software atual demonstra lógica e pedagogia no navegador; os componentes físicos não foram integrados.</text><text x="550" y="665" text-anchor="middle" fill="#8a7150" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">DIAGRAMA CONCEITUAL · NÃO É LISTA DE PEÇAS ADQUIRIDAS</text>
</svg>
