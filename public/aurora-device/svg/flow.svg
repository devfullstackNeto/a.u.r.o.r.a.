  <g fill="#617977" font-family="Arial,sans-serif" font-size="14"><text x="68" y="220">Escolha uma trilha</text><text x="296" y="220">Microfone previsto</text><text x="524" y="220">Regras do software</text><text x="752" y="220">Módulo pedagógico</text><text x="980" y="220">Áudio + vibração</text></g>
  <g fill="#a8783c" font-family="Arial,sans-serif" font-size="25"><text x="244" y="199">→</text><text x="472" y="199">→</text><text x="700" y="199">→</text><text x="928" y="199">→</text></g>
  <text x="600" y="313" text-anchor="middle" fill="#496863" font-family="Arial,sans-serif" font-size="15">Fluxo conceitual do wearable · no aplicativo atual, entrada e saída ocorrem no navegador.</text>
