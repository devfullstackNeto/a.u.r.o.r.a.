  <g fill="#fff" stroke="#d6e4dc" stroke-width="2"><rect x="48" y="120" width="188" height="132" rx="17"/><rect x="276" y="120" width="188" height="132" rx="17"/><rect x="504" y="120" width="188" height="132" rx="17"/><rect x="732" y="120" width="188" height="132" rx="17"/><rect x="960" y="120" width="188" height="132" rx="17"/></g>
  <g fill="#ae7c3c" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1"><text x="68" y="153">01</text><text x="296" y="153">02</text><text x="524" y="153">03</text><text x="752" y="153">04</text><text x="980" y="153">05</text></g>
